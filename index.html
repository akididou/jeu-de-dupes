<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2A0D14">
    <meta name="description" content="Borne Jeux de Dupes : trouvez le numéro de notre version de votre parfum préféré.">
    <title>Jeux de Dupes</title>
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<span class="data-dot" id="data-dot" hidden></span>

<!-- Écran 1 : accueil -->
<section class="screen home" id="screen-home" aria-labelledby="home-title">
    <div class="poster">
        <img src="assets/affiche.jpg" alt="" class="poster-img">
        <button class="poster-zone zone-elle" data-univers="femme" type="button">
            <span class="zone-tag">
                <span class="zone-title" data-i18n="elle">Elle</span>
                <span class="zone-sub" data-count="femme"></span>
            </span>
        </button>
        <button class="poster-zone zone-lui" data-univers="homme" type="button">
            <span class="zone-tag">
                <span class="zone-title" data-i18n="lui">Lui</span>
                <span class="zone-sub" data-count="homme"></span>
            </span>
        </button>
    </div>

    <div class="home-panel">
        <button class="lang-toggle" type="button" data-lang-toggle></button>
        <h1 id="home-title" data-i18n="homeTitle">Quel parfum aimez&#8209;vous&nbsp;?</h1>
        <p class="home-lead" data-i18n="homeLead"></p>
        <form class="search" role="search" data-search-form>
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input type="search" id="home-search" data-search-input
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   enterkeyhint="search" data-i18n-placeholder="placeholder">
            <label for="home-search" class="sr-only" data-i18n="searchLabel"></label>
        </form>
        <p class="home-hint" data-i18n="homeHint"></p>
    </div>
</section>

<!-- Écran 2 : collection / résultats -->
<section class="screen list" id="screen-list" hidden aria-labelledby="list-title">
    <header class="list-head">
        <div class="list-bar">
            <button class="back" type="button" data-home>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
                <span data-i18n="back">Accueil</span>
            </button>
            <div class="segmented" role="group" aria-label="Collection" data-i18n-aria="collectionLabel">
                <button type="button" data-univers="femme" data-i18n="elle">Elle</button>
                <button type="button" data-univers="homme" data-i18n="lui">Lui</button>
                <button type="button" data-univers="tous" data-i18n="tous">Tous</button>
            </div>
            <button class="lang-toggle" type="button" data-lang-toggle></button>
        </div>
        <form class="search search-compact" role="search" data-search-form>
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
            <input type="search" id="list-search" data-search-input
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   enterkeyhint="search" data-i18n-placeholder="placeholder">
            <label for="list-search" class="sr-only" data-i18n="searchLabel"></label>
            <button type="button" class="clear" data-clear hidden data-i18n-aria="clear">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
        </form>
        <div class="rail-tabs" id="rail-tabs" role="group" aria-label="Filtrer par" data-i18n-aria="railLabel" hidden>
            <button type="button" data-rail="marques" data-i18n="byBrand">Par marque</button>
            <button type="button" data-rail="familles" data-i18n="byFamily">Par famille</button>
        </div>
        <nav class="brand-rail" id="brand-rail" aria-label="Filtres" data-i18n-aria="filtersLabel"></nav>
    </header>

    <main class="list-body">
        <h2 id="list-title" class="list-title"></h2>
        <p class="list-count" id="list-count" aria-live="polite"></p>
        <div class="results" id="results"></div>
    </main>
</section>

<!-- Fiche parfum : le ticket -->
<!-- Nom accessible (« Notre version n°X, évoque NOM ») posé par openTicket dans views.js. -->
<dialog class="ticket-dialog" id="ticket">
    <article class="ticket">
        <div class="ticket-stub">
            <span class="ticket-kicker" data-i18n="ticketKicker">Notre version</span>
            <span class="ticket-num" id="ticket-num"></span>
        </div>
        <div class="ticket-body">
            <span class="ticket-evoque" data-i18n="evoque">Évoque</span>
            <span class="ticket-nom" id="ticket-nom"></span>
            <span class="ticket-marque" id="ticket-marque"></span>
            <span class="ticket-univers" id="ticket-univers"></span>
            <section class="ticket-notes" id="ticket-notes" hidden>
                <h3 data-i18n="notesTitle">Notes du parfum original</h3>
                <dl id="ticket-notes-list"></dl>
            </section>
            <p class="ticket-hint" data-i18n="ticketHint"></p>
            <button type="button" class="ticket-close" data-close-ticket data-i18n="close">Fermer</button>
        </div>
    </article>
</dialog>

<!-- Retour accueil automatique -->
<dialog class="idle" id="idle" role="alertdialog" aria-labelledby="idle-text">
    <div class="idle-card">
        <p id="idle-text" aria-live="assertive"></p>
        <button type="button" data-idle-continue data-i18n="continue">Continuer</button>
    </div>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
