<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="description" content="Découvrez les parfums associés aux personnages du film Jeux de Dupes">
    <title>Parfums des Personnages - Jeux de Dupes</title>

    <!-- Content Security Policy pour la sécurité -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: https:;
                   connect-src 'self' https://opensheet.elk.sh;">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- Skip to main content pour l'accessibilité -->
    <a href="#main-content" class="skip-to-content">Aller au contenu principal</a>

    <main id="main-content">
        <h1 class="sr-only">Jeux de Dupes - Parfums des Personnages</h1>
        <p class="instructions">Cliquez sur les personnages pour découvrir leurs parfums</p>

        <div class="container">
            <img src="assets/affiche.jpg"
                 class="image"
                 alt="Affiche du film Jeux de Dupes montrant les deux personnages principaux">

            <!-- ACCESSIBILITÉ: Zones cliquables accessibles au clavier -->
            <button class="map-area map-area-homme"
                    style="right: 0; top: 0%; width: 57%; height: 100%"
                    onclick="openModal('homme')"
                    aria-label="Découvrir les parfums masculins du personnage homme">
                <span class="sr-only">Cliquez pour voir les parfums masculins</span>
            </button>

            <button class="map-area map-area-femme"
                    style="left: 0; top: 0%; width: 43%; height: 100%;"
                    onclick="openModal('femme')"
                    aria-label="Découvrir les parfums féminins du personnage femme">
                <span class="sr-only">Cliquez pour voir les parfums féminins</span>
            </button>
        </div>

        <!-- Modal Parfums Masculins -->
        <div id="modalHomme" class="modal" role="dialog" aria-labelledby="modal-homme-title" aria-modal="true">
            <div class="modal-content">
                <!-- ACCESSIBILITÉ: Bouton de fermeture accessible au clavier -->
                <button class="close"
                        onclick="closeModal('homme')"
                        aria-label="Fermer la fenêtre des parfums masculins"
                        type="button">
                    <span aria-hidden="true">&times;</span>
                    <span class="sr-only">Fermer</span>
                </button>
                <h2 id="modal-homme-title">Collection de Parfums Masculins</h2>
                <ul class="parfum-list" id="hommeList" role="list"></ul>
            </div>
        </div>

        <!-- Modal Parfums Féminins -->
        <div id="modalFemme" class="modal" role="dialog" aria-labelledby="modal-femme-title" aria-modal="true">
            <div class="modal-content">
                <!-- ACCESSIBILITÉ: Bouton de fermeture accessible au clavier -->
                <button class="close"
                        onclick="closeModal('femme')"
                        aria-label="Fermer la fenêtre des parfums féminins"
                        type="button">
                    <span aria-hidden="true">&times;</span>
                    <span class="sr-only">Fermer</span>
                </button>
                <h2 id="modal-femme-title">Collection de Parfums Féminins</h2>
                <ul class="parfum-list" id="femmeList" role="list"></ul>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
