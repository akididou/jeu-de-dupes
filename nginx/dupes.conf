# Jeux de Dupes : borne tablette (site statique + proxy de la feuille de données)
# Lié dans /etc/nginx/sites-enabled/ par scripts/deploy.sh. Voir la spec, §6 et §7.

# ─── Limitation de débit ──────────────────────────────────────────────────────
# Une personne IPv6 dispose d'un /64 entier : on limite par préfixe /64.
map $remote_addr $dupes_client {
    ~^(?<v6dupes>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+): $v6dupes;
    default $remote_addr;
}
limit_req_zone  $dupes_client zone=dupes_site:10m rate=10r/s;
limit_req_zone  $dupes_client zone=dupes_api:1m   rate=30r/m;
limit_conn_zone $dupes_client zone=dupes_conn:10m;

# Cache de la réponse opensheet (créé et confié à www-data par deploy.sh).
proxy_cache_path /var/cache/nginx/dupes levels=1:2 keys_zone=dupes_sheet:1m max_size=10m inactive=7d use_temp_path=off;

# ─── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dupes.jppoizat.fr;

    access_log /var/log/nginx/dupes.access.log;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/dupes.error.log warn;

    # Renouvellement Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dupes.jppoizat.fr;

    # ── Certificats Let's Encrypt ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/dupes.jppoizat.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dupes.jppoizat.fr/privkey.pem;

    # ── Paramètres SSL recommandés par Mozilla ────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── Logs ──────────────────────────────────────────────────────────────────
    # Second journal : c'est le seul que fail2ban surveille (nginx-botsearch, nginx-4xx...).
    access_log /var/log/nginx/dupes.access.log;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/dupes.error.log warn;

    # ── Limites ───────────────────────────────────────────────────────────────
    limit_req        zone=dupes_site burst=40 nodelay;
    limit_conn       dupes_conn 20;
    limit_req_status  429;
    limit_conn_status 429;
    client_max_body_size 1k;

    # ── Site statique : liste blanche, tout le reste répond 404 ───────────────
    root /home/projects/jeu-de-dupes;
    autoindex off;

    include /home/projects/jeu-de-dupes/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # Site en lecture seule : GET et HEAD uniquement.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Le service worker gère le hors-ligne : le cache HTTP doit toujours revalider (ETag),
    # sinon une nouvelle version du SW pourrait précacher des fichiers périmés.
    location = / {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    location = /sw.js {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /css/ {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /js/ {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Polices, icônes et affiche : cache long (le SW les précache de toute façon).
    location ^~ /assets/fonts/ {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location ^~ /assets/icons/ {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location = /assets/affiche.jpg {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Tout autre fichier de assets/ : revalidation systématique.
    location ^~ /assets/ {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /data/parfums.json {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ── Proxy de la feuille de données (opensheet) ────────────────────────────
    # URL d'amont figée : aucun élément de la requête cliente n'est relayé (pas de SSRF).
    #  - `rewrite ... ?` impose le chemin et supprime la query string cliente ;
    #  - la clé de cache est fixe : une query string ne peut ni contourner ni polluer le cache ;
    #  - aucun en-tête ni corps du client n'est transmis.
    location = /api/parfums {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;

        # Un location qui déclare limit_req perd celles du server : on répète les deux zones.
        limit_req zone=dupes_site burst=40 nodelay;
        limit_req zone=dupes_api  burst=20 nodelay;

        default_type application/json;

        rewrite ^ /11QQ55WHs43F2B-M8TdxmKHM42U5h7QoWmHlSBAKt3MI/1? break;
        proxy_pass https://opensheet.elk.sh;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name opensheet.elk.sh;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host opensheet.elk.sh;
        proxy_set_header Accept "application/json";
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";

        # Réponse amont réduite au JSON : ni cookie, ni CORS, ni en-têtes de sécurité
        # amont (les nôtres font foi), ni Alt-Svc (qui redirigerait les navigateurs), ni
        # Cache-Control amont (le nôtre, no-cache, est ajouté ci-dessus), ni télémétrie Cloudflare.
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Alt-Svc;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Nel;
        proxy_hide_header Report-To;
        proxy_hide_header CF-RAY;
        proxy_hide_header CF-Cache-Status;
        proxy_intercept_errors on;

        # Notre cache de 5 min s'applique, quoi que demande l'amont.
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache dupes_sheet;
        proxy_cache_key "dupes_sheet";
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
    }

    # Tout le reste (fichiers cachés, nginx/, sauvegardes, docs...) : 404.
    location / {
        include /home/projects/jeu-de-dupes/nginx/security-headers.conf;
        return 404;
    }
}
